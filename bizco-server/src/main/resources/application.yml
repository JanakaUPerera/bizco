spring:
  application:
    name: bizco-server
  datasource:
    url: jdbc:postgresql://localhost:5432/bizco
    username: bizco
    password: bizco
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: logs/bizco-server.log
  level:
    com.bizco: INFO
    org.springframework.security: INFO
