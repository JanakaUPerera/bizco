spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: bizco-server
  datasource:
    url: ${BIZCO_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bizco}
    username: ${BIZCO_DATASOURCE_USERNAME:bizco}
    password: ${BIZCO_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# TLS is off by default so local development, CI, and Testcontainers-backed tests keep working
# against plain HTTP without a certificate. Production/LAN deployments should activate the `tls`
# profile (see application-tls.yml and docs/TlsDeploymentGuide.md) to serve HTTPS with TLS 1.3,
# as required by SRS.md Section 7.2 / Section 6.22.7.
server:
  port: ${SERVER_PORT:8080}

bizco:
  initial-admin-password: ${BIZCO_INITIAL_ADMIN_PASSWORD:}
  database-bootstrap:
    enabled: ${BIZCO_DATABASE_BOOTSTRAP_ENABLED:true}
    admin-url: ${BIZCO_DATABASE_BOOTSTRAP_ADMIN_URL:}
    admin-username: ${BIZCO_DATABASE_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BIZCO_DATABASE_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    max-concurrent-sessions: ${BIZCO_MAX_CONCURRENT_SESSIONS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: logs/bizco-server.log
  level:
    com.bizco: INFO
    org.springframework.security: INFO
